<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Netlify Forms</title></head>
<body>
  <!-- Formulaire de contact enregistré pour Netlify Forms -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" type="text" />
    <input name="email" type="email" />
    <input name="phone" type="tel" />
    <select name="service">
      <option value="conseil-image">Conseil en image</option>
      <option value="personal-branding">Personal branding</option>
      <option value="creation-sur-mesure">Création sur mesure</option>
      <option value="accompagnement-entreprises">Accompagnement entreprises</option>
    </select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
